name: CI

# OnMyCompany quality gates (aligned with OnMyAgent-style layered checks):
#   lint → format → typecheck → vitest
# Local equivalent: `npm run ci`  (or `npm run check` for typecheck+test only)
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Native Node type stripping (see AGENTS.md). Do NOT go below 22.18.
  NODE_VERSION: "24"

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CI (lint + format + typecheck + test)
        run: npm run ci

  # Optional matrix slices (same as local `npm run test:*`)
  test-slices:
    name: Test slices
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        slice: [test:company, test:web, test:server]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.slice }}
