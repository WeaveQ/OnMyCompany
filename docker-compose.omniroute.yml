# Optional OmniRoute sidecar (model plane) — process-isolated from OnMyCompany.
#
# Ports (do not collide with OMA 5173/8787 or OMC 3100/5180):
#   OmniRoute API + dashboard: 20128
#
# Usage (sidecar only):
#   docker compose -f docker-compose.omniroute.yml up -d
#
# Usage with product build (if you also run OMC via compose):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.omniroute.yml up --build
#
# Local without Docker (lighter for dev):
#   npm run dev:omniroute
#
# Agent chat base URL:  http://127.0.0.1:20128/v1
# Dashboard:            http://127.0.0.1:20128/dashboard
# OMC tools stay on:    http://127.0.0.1:3100  (/v1/actions · /mcp)

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omc-omniroute
    restart: unless-stopped
    ports:
      - "${OMNIROUTE_PORT:-20128}:20128"
    environment:
      PORT: "20128"
      DASHBOARD_PORT: "20128"
      API_HOST: "0.0.0.0"
      # OMC console origin may link here; adjust if you change ports
      LIVE_WS_ALLOWED_ORIGINS: "${OMNIROUTE_ALLOWED_ORIGINS:-http://127.0.0.1:20128,http://localhost:20128,http://127.0.0.1:5180,http://localhost:5180}"
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:20128/v1/models').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  omniroute-data:
