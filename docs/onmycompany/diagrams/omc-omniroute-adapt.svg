  <text x="68" y="558" class="h">OrgConfig models.json</text>
  <text x="68" y="578" class="s">企业「逻辑模型」指向</text>
  <text x="68" y="594" class="s">OmniRoute baseUrl（目录声明）</text>
  <rect x="316" y="530" width="240" height="64" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="328" y="558" class="h">profiles/company 镜像</text>
  <text x="328" y="578" class="s">登录后下发 policy / skills</text>
  <text x="328" y="594" class="s">无 secret · 无 LLM Key</text>
  <rect x="576" y="530" width="220" height="64" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="588" y="558" class="h">runtime token</text>
  <text x="588" y="578" class="s">OMC 绑定 memberId</text>
  <text x="588" y="594" class="s">只用于工具 /v1 · MCP</text>
  <rect x="816" y="530" width="220" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="828" y="558" class="h">OmniRoute dashboard key</text>
  <text x="828" y="578" class="s">只用于模型 /v1</text>
  <text x="828" y="594" class="s">与 OMC token 分离</text>
  <path d="M 176 530 L 176 460" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="184" y="500" class="s" fill="#059669">声明模型出口</text>
  <path d="M 686 530 L 686 460" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="694" y="500" class="s" fill="#059669">策略 · Skills</text>
  <rect x="40" y="630" width="1020" height="120" rx="12" fill="#0f172a"/>
  <text x="56" y="656" class="h" fill="#f8fafc">适配原则（钉死）</text>
  <text x="56" y="680" class="s" fill="#cbd5e1">1. 默认：Chat → OmniRoute；工具 → OMC。不把 268 模型路由塞进 OMC 进程（G1b 非默认）。</text>
  <text x="56" y="698" class="s" fill="#cbd5e1">2. 密钥分离：模型 Key 在 OmniRoute；SaaS 连接 Key 在 OMC Connections。OrgConfig 永不存 secret。</text>
  <text x="56" y="716" class="s" fill="#cbd5e1">3. 审计分离：LLM 用量看 OmniRoute dashboard；业务外发看 OMC runs / 审计事件 / memberId。</text>
  <text x="56" y="734" class="s" fill="#cbd5e1">4. 端口：OMA 5173/8787 · OmniRoute 20128 · OMC API 3100 · Console 5180。可选：models 仅登记 OmniRoute 逻辑端点。</text>
  <line x1="780" y1="656" x2="810" y2="656" stroke="#2563eb" stroke-width="2"/>
  <text x="818" y="660" class="s" fill="#94a3b8">模型流</text>
  <line x1="880" y1="656" x2="910" y2="656" stroke="#ea580c" stroke-width="2"/>
  <text x="918" y="660" class="s" fill="#94a3b8">工具流</text>
  <line x1="980" y1="656" x2="1010" y2="656" stroke="#059669" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="1018" y="660" class="s" fill="#94a3b8">配置</text>
