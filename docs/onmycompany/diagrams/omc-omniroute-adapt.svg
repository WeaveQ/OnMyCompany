  <text x="68" y="380" class="s">免费额度池 · 268 providers</text>
  <rect x="296" y="300" width="220" height="72" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="308" y="328" class="h">Dashboard / Key</text>
  <text x="308" y="348" class="s">本地 SQLite · 密钥在本机</text>
  <text x="308" y="364" class="s">策略: auto /cheap /coding</text>
  <rect x="56" y="390" width="460" height="52" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
