  <rect x="40" y="240" width="500" height="220" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="56" y="264" class="zone" fill="#1d4ed8">L1a · 模型层 · OmniRoute</text>
  <text x="56" y="282" class="s">端口 :20128 · OpenAI 兼容 /v1 · 不进 OMC 默认主路径</text>
  <rect x="56" y="300" width="220" height="72" rx="10" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="68" y="328" class="h">OmniRoute Gateway</text>
  <text x="68" y="348" class="s">baseURL localhost:20128/v1</text>
