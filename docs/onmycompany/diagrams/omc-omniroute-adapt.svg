  <text x="576" y="282" class="s">端口 API :3100 · 管理台 :5180 · 主菜 = 连接 / 策略 / 外发</text>
  <rect x="576" y="300" width="200" height="72" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="588" y="328" class="h">Company 管控面</text>
  <text x="588" y="348" class="s">登录 · 成员 · 团队</text>
  <text x="588" y="364" class="s">OrgConfig · Skills · 策略</text>
  <rect x="796" y="300" width="240" height="72" rx="10" fill="#ffffff" stroke="#fb923c" stroke-width="1.5"/>
  <text x="808" y="328" class="h">Connect Gateway</text>
  <text x="808" y="348" class="s">/v1/actions · /mcp</text>
  <text x="808" y="364" class="s">Connections · OAuth · runs</text>
  <rect x="576" y="390" width="460" height="52" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <text x="592" y="412" class="h">业务 SaaS / 内部系统（组织共享连接）</text>
  <text x="592" y="430" class="s">飞书 · Gmail · GitHub · Notion · HN(no_auth) · … · secret 仅服务端</text>
  <path d="M 676 372 L 676 390" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <path d="M 916 372 L 916 390" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange)"/>
  <rect x="40" y="490" width="1020" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="56" y="514" class="zone" fill="#64748b">L2 · 配置与契约（如何适配，不双写密钥）</text>
